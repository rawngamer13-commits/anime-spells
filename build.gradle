plugins {
    id 'net.minecraftforge.gradle' version '2.0.2'
    id 'maven-publish'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'com.rawngamer13.animespells'
archivesBaseName = 'anime-spells'

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    version = '1.12.2-14.23.5.2860'
    runDir = 'run'
    
    mappings = 'snapshot_20171003'
    
    makeObfSourceJar = false
}

dependencies {
    deobfCompile 'net.electroblob:wizardry:4.3.0'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'anime-spells',
            'Specification-Vendor': 'rawngamer13',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' :'rawngamer13',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
